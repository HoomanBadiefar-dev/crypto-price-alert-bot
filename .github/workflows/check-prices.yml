name: Check Crypto Prices

on:
  schedule:
    # هر 5 دقیقه یک‌بار اجرا می‌شه
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # اجازه‌ی اجرای دستی از تب Actions

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Commit updated alerts and state files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add alerts.json state.json
          git diff --quiet && git diff --staged --quiet || git commit -m "update alerts/state"
          git pull --rebase
          git push
